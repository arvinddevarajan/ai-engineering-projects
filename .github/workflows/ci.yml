name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-document-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r document-qa/requirements.txt
      - name: Lint
        run: ruff check document-qa/

  lint-llm-eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r llm-eval-harness/requirements.txt
      - name: Lint
        run: ruff check llm-eval-harness/