name: Document Q&A CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "document-qa/**"
      - ".github/workflows/document-qa-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "document-qa/**"
      - ".github/workflows/document-qa-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: document-qa

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: document-qa/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile main.py agent.py rag.py

  build:
    name: Build container
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./document-qa
          file: ./document-qa/Dockerfile
          push: false
          tags: document-qa:test
